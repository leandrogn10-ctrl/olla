<!DOCTYPE html>
<!-- La Olla v2 boot harness: loads index.html in an iframe on a REAL layout and writes HARNESS: PASS/FAIL lines into #out.
     Run: bash gate.sh. const/let globals are not window properties in a classic script, so app globals are reached
     with W().eval(name). What it pins that node cannot: a cold boot renders Hoy; a tap on a meal's ring opens the
     sheet and «Sí, lo del plan» lands in the REALITY log and SURVIVES A RELOAD; a hand row set in La semana survives
     a reload; the recipe sheet scales its quantities; the cook-along opens, steps, keeps its session across a reload;
     La lista checks persist per (item, trip); the kitchen settings render; the sibling gist is refused; the ring a
     finger would hit is the ring (elementFromPoint, never a dispatched click on a hidden node).
     Then the flows the final UI review found unrun (1-oct): a cook question answered «Sí» with a yield, and «Otra cosa»
     BEFORE its dinner can be logged (the purchase must survive as a batch); a planned cook-along finished (its batch made)
     and an off-plan one (a cooked batch, the dinner log untouched); the pot sheet's «Comer una» at dinner and after it;
     the cook-along closed before «Empezar» (Hoy keeps its real action); the runner as a modal dialog; 44px targets.
     CONTROLS: the log assertion is re-run with OLLA.logMeal stubbed out and must read FAIL (the instrument can see an
     absent write); the «otra cosa» flow is re-run with the OLD path re-planted (the purchase written as a dinner MEAL
     before the dinner can be logged) and must read FAIL; a ring shrunk to 30px must fail the 44px check. gate.sh
     requires every CONTROL line to read FAIL. -->
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="out"></pre>
<iframe id="f" src="about:blank" style="width:375px;height:812px"></iframe>
<script>
'use strict';
const out = [];
function log(name, ok, extra) { out.push(`HARNESS: ${ok ? 'PASS' : 'FAIL'} >> ${name}${extra ? ' >> ' + extra : ''}`); render(); }
function render() { document.getElementById('out').textContent = out.join('\n'); }
const f = document.getElementById('f');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const W = () => f.contentWindow, D = () => f.contentDocument;
const q = s => D().querySelector(s), qa = s => Array.from(D().querySelectorAll(s));
const st = () => JSON.parse(W().localStorage.getItem('olla.v1'));
const E = name => W().eval(name);
const CLOCK = '2026-10-01T19:30:00';   // a Thursday (a training day), dinner time: every assertion below is about THIS moment, never the hour the gate runs
async function loadApp() { f.src = 'index.html?clock=' + CLOCK + '&h=' + Date.now(); await new Promise(r => f.onload = r); await sleep(800); }
async function loadAt(clock) { f.src = 'index.html?clock=' + clock + '&h=' + Date.now(); await new Promise(r => f.onload = r); await sleep(800); }
function patchSt(fn) { const s = st(); fn(s); W().localStorage.setItem('olla.v1', JSON.stringify(s)); }   // edit the stored state between two loads
const toastErr = () => q('#toast').classList.contains('show') && q('#toast').classList.contains('err');
function smallTargets(scope) {   // every visible tap target under scope narrower or shorter than 44px
  const els = Array.from(new Set(qa(['button', 'a[href]', 'input', 'textarea', 'select', '[data-act]'].map(s => scope + ' ' + s).join(', '))));
  return els.filter(e => { const r = e.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return false; const cs = W().getComputedStyle(e); return cs.visibility !== 'hidden' && cs.display !== 'none' && (r.width < 44 || r.height < 44); })
    .map(e => (e.className || e.tagName) + '[' + (e.dataset.act || e.dataset.kact || e.id || '') + '] ' + Math.round(e.getBoundingClientRect().width) + 'x' + Math.round(e.getBoundingClientRect().height));
}
async function toRunnerEnd() { let g = 0; while (!q('#runner').hidden && !q('#runner [data-stepper="ryield"]') && g++ < 40) { q('#runner [data-act="r-next"]').click(); await sleep(60); } }
/* «Otra cosa» on today's cook question at 17:45, his dinner set to 21:00 (so it can't be logged before 19:30). `before` runs
   after the 17:45 load — the control re-plants the old path there. */
async function otraCosaBeforeDinner(before) {
  localStorage.clear(); await loadAt('2026-10-01T09:00:00');
  patchSt(s => { s.settings.eatAt.dinner = '21:00'; });
  await loadAt('2026-10-01T09:00:00');
  const b = (st().plan.days['2026-10-01'].cook || {}).batch;
  await loadAt('2026-10-01T17:45:00');
  if (before) before();
  const qo = q('#app-root [data-act="q-other"][data-batch="' + b + '"]'); if (!qo) return { b, asked: false };
  qo.click(); await sleep(200);
  const hidden = !q('#olla-sheet [data-act="log-skip"]') && !q('#olla-sheet [data-act="log-ate"]');
  q('#log-what').value = 'pollo rostizado';
  const plus = q('#olla-sheet [data-stepper="left"] [data-d="1"]'); plus.click(); plus.click(); await sleep(60);
  q('#olla-sheet [data-act="log-other"]').click(); await sleep(300);
  const s = st(), id = Object.keys(s.extra || {}).find(k => s.extra[k].src === 'bought' && s.extra[k].name === 'pollo rostizado');
  return { b, asked: true, hidden, err: toastErr(), toast: q('#toast').textContent, cook: eff((s.cooks || {})[b]), extra: id ? s.extra[id] : null, id, dinner: s.plan.days['2026-10-01'].dinner, dinnerLog: (s.log || {})['2026-10-01:dinner'] };
}
function hit(el) { const r = el.getBoundingClientRect(); if (r.width < 8 || r.height < 8) return false; const x = D().elementFromPoint(r.left + r.width / 2, r.top + r.height / 2); return x === el || el.contains(x); }
function eff(entries) { if (!Array.isArray(entries) || !entries.length) return null; return entries.reduce((a, b) => ((b.at || 0) >= (a.at || 0) ? b : a)); }
(async () => {
  try {
    localStorage.clear();
    await loadApp();
    const today = E('OLLAUI').todayYmd();
    log('boots on Hoy', q('#bottom-tabs .tab.active') && q('#bottom-tabs .tab.active').dataset.view === 'hoy');
    log('state written on boot with a plan for today', !!(st() && st().plan && st().plan.days[today]));
    log('schema is 3', st() && st().schema === 3, st() && String(st().schema));
    log('the house holds salt and pepper, nothing else', JSON.stringify(st().settings.pantry) === JSON.stringify(['sal', 'pimienta']), JSON.stringify(st().settings.pantry));
    const slots = E('OLLA').slotsFor(st(), today);
    log('Hoy renders one row per slot', qa('#app-root .row').length === slots.length, qa('#app-root .row').length + ' vs ' + slots.length);
    log('the pot panel is there', !!q('#app-root .pot-panel'));
    log('the week strip has seven bowls', qa('#app-root .bowl').length === 7, String(qa('#app-root .bowl').length));
    log('data-theme follows the clock (auto): 19:30 is Peltre', D().documentElement.getAttribute('data-theme') === 'macchiato', D().documentElement.getAttribute('data-theme'));
    // the ring a finger would hit is the ring
    const ring = q('#app-root .row:nth-child(1) .ring');
    ring.scrollIntoView({ block: 'center' }); await sleep(80);
    log('the first ring is what a finger hits (elementFromPoint)', hit(ring));
    // log «Sí, lo del plan» for the first slot via the sheet
    const sl0 = slots[0];
    ring.click(); await sleep(150);
    log('the ring opens the sheet', q('#olla-sheet').open);
    q('#olla-sheet [data-act="log-ate"]').click(); await sleep(200);
    const e0 = eff((st().log || {})[today + ':' + sl0]);
    log('«Sí, lo del plan» lands in the reality log', !!e0 && e0.s === 'ate', JSON.stringify(e0));
    log('the plan row was not written by the log', !st().plan.days[today][sl0].s);
    log('the ring turns «ate»', !!q('#app-root .row:nth-child(1) .ring.ate'));
    // RELOAD
    await loadApp();
    const e1 = eff((st().log || {})[today + ':' + sl0]);
    log('RELOAD keeps the log entry', !!e1 && e1.s === 'ate');
    log('…and the ring still reads «ate»', !!q('#app-root .row:nth-child(1) .ring.ate'));
    // CONTROL: the same assertion, with the write disabled, must see the absence
    {
      const s2 = slots[1];
      const O = E('OLLA'), real = O.logMeal; O.logMeal = () => ({ ok: true });
      q('#app-root .row:nth-child(2) .ring').click(); await sleep(150);
      q('#olla-sheet [data-act="log-ate"]').click(); await sleep(150);
      const ec = eff((st().log || {})[today + ':' + s2]);
      log('CONTROL (must read FAIL): a stubbed logMeal still lands in the log', !!ec && ec.s === 'ate');
      O.logMeal = real;
    }
    // La semana: cycle a FUTURE dinner, persist, reload
    q('#bottom-tabs .tab[data-view="semana"]').click(); await sleep(150);
    log('La semana renders seven day cards', qa('#app-root .day').length === 7, String(qa('#app-root .day').length));
    const tomorrow = E('OLLA').addDays(today, 1);

    const kBefore = st().plan.days[tomorrow].dinner.kind;
    pill.click(); await sleep(200);
    const kAfter = st().plan.days[tomorrow].dinner;
    log('a tap moves tomorrow\'s dinner to another kind, by hand', kAfter.kind !== kBefore && kAfter.hand === true, kBefore + ' → ' + kAfter.kind);
    await loadApp();
    log('RELOAD keeps the hand row', st().plan.days[tomorrow].dinner.kind === kAfter.kind && st().plan.days[tomorrow].dinner.hand === true);
    // El libro: recipe sheet scales
    q('#bottom-tabs .tab[data-view="libro"]').click(); await sleep(150);
    log('El libro lists recipes', qa('#app-root .rec').length >= 15, String(qa('#app-root .rec').length));
    q('#app-root .rec').click(); await sleep(150);
    log('a recipe opens with steps', q('#olla-sheet').open && qa('#olla-sheet .steps li').length >= 2);
    const q1 = (q('#olla-sheet .ings li .q') || {}).textContent;
    q('#olla-sheet [data-stepper="rx"] [data-d="1"]').click(); q('#olla-sheet [data-stepper="rx"] [data-d="1"]').click(); await sleep(80);
    const q2 = (q('#olla-sheet .ings li .q') || {}).textContent;
    log('the servings stepper rescales the quantities', !!q1 && q1 !== q2, q1 + ' → ' + q2);
    // the cook-along
    q('#olla-sheet [data-act="runner-start"]').click(); await sleep(200);
    log('the cook-along opens full-screen', !q('#runner').hidden && !!q('#runner .r-body'));
    q('#runner [data-act="r-next"]').click(); await sleep(120);
    log('«Empezar» moves to step 1', st().cookSession && st().cookSession.step === 0, JSON.stringify(st().cookSession && st().cookSession.step));
    await loadApp();
    log('RELOAD keeps the cook session; Hoy offers «Seguir»', !!st().cookSession && !!q('#app-root [data-act="runner-resume"]'));
    { const na = E('OLLA').nextAction(st(), today, E('OLLAUI').nowMin()).kind;   // what Hoy's action IS right now, from the engine — then find ITS control on the page
      const sel = { eat: '[data-act="ate"]', 'cook-now': '[data-act="cook"]', 'cook-soon': '[data-act="cook"]', shop: '.strike[data-act="go"][data-view="lista"]', rescue: '.rescue-item', 'confirm-cook': '[data-act="q-yes"]' }[na];
      log('…as an extra line with «dejarlo», never a mask over Hoy\'s own action', !!q('#app-root [data-act="runner-drop"]') && !!sel && !!q('#app-root ' + sel), na + (sel && q('#app-root ' + sel) ? ' shown' : ' MISSING')); }
    q('#app-root [data-act="runner-resume"]').click(); await sleep(150);
    q('#runner [data-act="runner-close"]').click(); await sleep(100);
    // La lista
    q('#bottom-tabs .tab[data-view="lista"]').click(); await sleep(150);
    const items = qa('#app-root .item');
    log('La lista derives items for the week\'s cooks', items.length >= 3, String(items.length));
    if (items.length) {
      const key = items[0].dataset.key; items[0].click(); await sleep(150);
      const c = (st().groceries.checked || {})[key];
      log('checking an item persists per item@trip', !!c && (c.v === true || c === true), key + ' ' + JSON.stringify(c));
      log('the key carries the trip date', /@\d{4}-\d{2}-\d{2}$/.test(key || ''), key);
      const total = qa('#app-root .item').length, onRow = q('#app-root .item[data-key="' + key + '"]');
      log('the ticked line STAYS where it was, wearing the mark (it never leaves the list)', !!onRow && onRow.classList.contains('on') && onRow.getAttribute('aria-pressed') === 'true', onRow ? onRow.className : 'GONE');
      const tickedKeys = [key]; for (let g = 0; g < total + 2; g++) { const nx = qa('#app-root .item:not(.on)').find(x => x.dataset.key.slice(-10) <= E('OLLA').addDays(today, 1)); if (!nx) break; tickedKeys.push(nx.dataset.key); nx.click(); await sleep(40); }   // every tap re-renders the page: re-query, never hold a node
      const ticked = Array.from(new Set(tickedKeys)), gone = ticked.filter(k => !q('#app-root .item.on[data-key="' + k + '"]'));
      log('ticking line after line, every TICKED line is still there, marked (another dish may legitimately drop its own unticked lines once the cook is certain)', ticked.length >= total - 6 && gone.length === 0, ticked.length + ' ticked of ' + total + ' at first; gone: ' + gone.join(','));
      log('CONTROL (must read FAIL): a line that was never on the list is found by the same query', !!q('#app-root .item[data-key="no-such-line@2026-10-01"]'));
    }
    // settings
    q('#settings-btn').click(); await sleep(200);
    log('the kitchen settings render inside the sheet', q('#settings-modal').open && qa('#kitchen-settings [data-kact="win"]').length === 7);
    q('#settings-modal [data-close="settings"]').click(); await sleep(80);
    // the sibling's gist is refused
    log('looksLikeMyState refuses cuaderno.json', E('looksLikeMyState')({ settings: {}, exercises: [], sessions: [] }) === false);
    log('looksLikeMyState accepts our state', E('looksLikeMyState')(st()) === true);
    log('the app reads the pinned LOCAL day, through the one clock', E('OLLAUI').todayYmd() === '2026-10-01' && E('OLLAUI').nowMin() >= 19 * 60 + 30 && E('OLLAUI').nowMin() < 19 * 60 + 40, E('OLLAUI').todayYmd() + ' ' + E('OLLAUI').nowMin());

    // ── A cook question answered «Sí» with a yield (Wednesday's cook, asked Thursday morning)
    localStorage.clear(); await loadAt('2026-09-30T09:00:00');
    const wedB = (st().plan.days['2026-09-30'].cook || {}).batch;
    await loadAt('2026-10-01T08:00:00');
    const qy = q('#app-root [data-act="q-yes"][data-batch="' + wedB + '"]');
    log('Thursday 08:00: Hoy asks about Wednesday\'s unconfirmed cook', !!wedB && !!qy, wedB);
    if (qy) {
      qy.click(); await sleep(200);
      const y0 = parseInt((q('#olla-sheet [data-stepper="yield"] [data-val]') || {}).textContent, 10);
      q('#olla-sheet [data-stepper="yield"] [data-d="1"]').click(); await sleep(60);
      q('#olla-sheet [data-act="cookq-save"]').click(); await sleep(250);
      const ec = eff((st().cooks || {})[wedB]);
      log('«Sí» with a yield: the cook is MADE with the tápers he counted', !!ec && ec.s === 'made' && ec.yield === y0 + 1, JSON.stringify(ec) + ' (stepper ' + y0 + '+1)');
      log('…and the question is gone', !q('#app-root [data-act="q-yes"][data-batch="' + wedB + '"]'));
    }

    // ── «Otra cosa» before the dinner can be logged: the purchase survives as a BATCH
    const oc = await otraCosaBeforeDinner();
    log('Thursday 17:45 (dinner at 21:00): Hoy asks about today\'s cook', oc.asked, oc.b);
    log('…«Otra cosa» offers neither «lo del plan» nor «no comí» (both would be refused)', !!oc.hidden);
    log('…«compré pollo rostizado, rinde 2 más» saves without an error', oc.asked && !oc.err, oc.toast);
    log('…the cook is «no se hizo»', !!oc.cook && oc.cook.s === 'notmade', JSON.stringify(oc.cook));
    log('…the purchase is KEPT as a batch: bought, 3 portions, tied to no meal', !!oc.extra && oc.extra.servings === 3 && !('log' in oc.extra), JSON.stringify(oc.extra));
    log('…tonight\'s dinner eats from it, and the dinner log was not touched', !!oc.id && !!oc.dinner && oc.dinner.kind === 'leftover' && oc.dinner.of === oc.id && !oc.dinnerLog, JSON.stringify(oc.dinner));
    {   // CONTROL: re-plant the old path — the purchase written as a dinner MEAL before the dinner can be logged (refused, lost)
      const ocC = await otraCosaBeforeDinner(() => { const O = E('OLLA'); O.addBatch = (s, x, t, n, at) => O.logMeal(s, t, 'dinner', { s: 'other', what: x.name, left: x.servings - 1 }, t, n, at); });
      log('CONTROL (must read FAIL): the old path (a dinner MEAL before dinner) keeps the purchase as a batch', !!ocC.extra && ocC.extra.servings === 3 && !('log' in ocC.extra), ocC.toast);
    }

    // ── A PLANNED cook-along finished: its batch is made
    localStorage.clear(); await loadAt('2026-10-01T09:00:00');
    const thuC = st().plan.days['2026-10-01'].cook || {};
    q('#bottom-tabs .tab[data-view="semana"]').click(); await sleep(150);
    q('#app-root .crow .dish[data-date="2026-10-01"]').click(); await sleep(200);
    q('#olla-sheet [data-act="runner-start"]').click(); await sleep(200);
    log('the planned cook-along opens on the plan\'s batch', !!thuC.batch && !!st().cookSession && st().cookSession.batch === thuC.batch, JSON.stringify(st().cookSession && st().cookSession.batch));
    await toRunnerEnd();
    const yv = parseInt((q('#runner [data-stepper="ryield"] [data-val]') || {}).textContent, 10);
    q('#runner [data-act="r-next"]').click(); await sleep(300);   // «A la olla»
    const mc = eff((st().cooks || {})[thuC.batch]);
    log('finishing it marks the planned batch MADE, with the tápers counted', !!mc && mc.s === 'made' && mc.yield === yv, JSON.stringify(mc));
    log('…and ends the cook-along', q('#runner').hidden && st().cookSession === null);

    // ── The pot sheet's «Comer una»: tonight's dinner at 19:30; the post-gym meal at 22:30, never a second dinner

    await loadAt('2026-10-01T19:30:00');
    q('#app-root [data-act="pot"]').click(); await sleep(200);
    q('#olla-sheet [data-act="pot-eat"]').click(); await sleep(250);
    const dl = eff((st().log || {})['2026-10-01:dinner']);
    log('«Comer una» at 19:30 is tonight\'s dinner, from that pot', !!dl && dl.s === 'ate' && dl.of === thuC.batch, JSON.stringify(dl));
    await loadAt('2026-10-01T22:30:00');
    const potA = potSum(22 * 60 + 30);
    q('#app-root [data-act="pot"]').click(); await sleep(200);
    const eat2 = q('#olla-sheet [data-act="pot-eat"]'); if (eat2) { eat2.click(); await sleep(250); }
    const pl = eff((st().log || {})['2026-10-01:post']), potB = potSum(22 * 60 + 30);
    log('«Comer una» at 22:30 after dinner is the post-gym meal — never a second dinner', !!pl && pl.s === 'ate' && pl.of === thuC.batch && ((st().log || {})['2026-10-01:dinner'] || []).length === 1, JSON.stringify(pl));
    log('…and the pot drops by one', potA >= 1 && potB === potA - 1, potA + ' → ' + potB);

    // ── An OFF-PLAN cook-along (Saturday 13:00, before any dinner can be logged): a cooked batch, the dinner log untouched
    localStorage.clear(); await loadAt('2026-10-03T13:00:00');
    q('#bottom-tabs .tab[data-view="libro"]').click(); await sleep(150);
    q('#app-root .rec[data-id="chaufa-express"]').click(); await sleep(200);
    q('#olla-sheet [data-act="runner-start"]').click(); await sleep(200);
    await toRunnerEnd();
    const y5 = parseInt((q('#runner [data-stepper="ryield"] [data-val]') || {}).textContent, 10);
    q('#runner [data-act="r-next"]').click(); await sleep(300);
    const s5 = st(), x5 = Object.values(s5.extra || {}).find(x => x.src === 'cooked' && x.recipe === 'chaufa-express');
    log('an off-plan cook-along finishes into a COOKED batch with its tápers', !!x5 && x5.servings === y5, JSON.stringify(x5));
    log('…the dinner log is untouched, nothing was refused, the runner closed', !(s5.log || {})['2026-10-03:dinner'] && !toastErr() && q('#runner').hidden, q('#toast').textContent);

    // ── Closing the cook-along before «Empezar»: Hoy keeps its real action; the runner is a modal dialog while open
    localStorage.clear(); await loadApp();
    const a0 = (q('#app-root .strike') || { dataset: {} }).dataset.act, inert0 = q('.app').inert;
    q('#bottom-tabs .tab[data-view="libro"]').click(); await sleep(150);
    q('#app-root .rec').click(); await sleep(200);
    q('#olla-sheet [data-act="runner-start"]').click(); await sleep(250);
    const rn = q('#runner');
    log('the runner is a modal dialog: role, aria-modal, the page behind it inert, focus on its main button', inert0 === false && rn.getAttribute('role') === 'dialog' && rn.getAttribute('aria-modal') === 'true' && q('.app').inert === true && q('#bottom-tabs').inert === true && D().activeElement === q('#runner [data-act="r-next"]'), 'inert0=' + inert0 + ' active=' + (D().activeElement && (D().activeElement.dataset.act || D().activeElement.tagName)));
    { const got = qa('#runner [data-act="got"]');
      log('…its «saca esto» lines are real buttons that say whether they are on the table', got.length > 0 && got.every(b => b.tagName === 'BUTTON' && b.hasAttribute('aria-pressed')), got.length + ' ' + (got[0] && got[0].tagName)); }
    q('#runner [data-act="runner-close"]').click(); await sleep(200);
    log('…closed, the page behind is live again', q('.app').inert === false && q('#bottom-tabs').inert === false);
    q('#bottom-tabs .tab[data-view="hoy"]').click(); await sleep(200);
    const a1 = (q('#app-root .strike') || { dataset: {} }).dataset.act;
    log('closed before «Empezar»: no «Seguir», no session, Hoy\'s real action is back', !q('#app-root [data-act="runner-resume"]') && st().cookSession === null && !!a0 && a1 === a0, a0 + ' → ' + a1);

    // ── «Cociné otra cosa» at dinner: a COOKED batch (it counts toward the rung); «Compré» is the default, shown chosen
    localStorage.clear(); await loadApp();
    q('#app-root .row:nth-child(3) .ring').click(); await sleep(200);   // tonight's dinner
    const bought = q('#olla-sheet [data-act="mode"][data-v="bought"]');
    log('the log sheet opens with «Compré» chosen, and says so (aria-pressed)', !!bought && bought.classList.contains('on') && bought.getAttribute('aria-pressed') === 'true');
    q('#olla-sheet [data-act="mode"][data-v="cooked"]').click(); q('#log-what').value = 'Chaufa express de pollo';

    { const s = st(), x = Object.values(s.extra || {}).find(v => v.log === '2026-10-01:dinner');

    { const wk = qa('#kitchen-settings [data-kact="weekly"]').map(b => b.dataset.k);

    { const w3 = q('#kitchen-settings [data-kact="win"][data-i="3"]'), before = JSON.stringify(st().settings.cookWindows['3']);

    patchSt(s => { const c = s.plan.days['2026-10-01'].cook; c.at = '<img id=xss1 src=x>'; s.cooks[c.batch] = [{ s: 'made', at: 1 }];
      s.likes['bowl-coreano'] = { v: '"><img id=xss2 src=x>', at: 1 }; s.settings.hall.swipesPerWeek = '<img id=xss3 src=x>';
      const r = s.recipes.find(x => x.id === 'bowl-coreano'); r.sources = ['javascript:alert(1)'].concat(r.sources || []); r.minutes.total = '<img id=xss4 src=x>'; });
    await loadAt('2026-10-01T15:00:00');
