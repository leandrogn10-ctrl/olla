<!DOCTYPE html>
<!-- La Olla v2 boot harness: loads index.html in an iframe on a REAL layout and writes HARNESS: PASS/FAIL lines into #out.
     Run: bash gate.sh. const/let globals are not window properties in a classic script, so app globals are reached
     with W().eval(name). What it pins that node cannot: a cold boot renders Hoy; a tap on a meal's ring opens the
     sheet and «Sí, lo del plan» lands in the REALITY log and SURVIVES A RELOAD; a hand row set in La semana survives
     a reload; the recipe sheet scales its quantities; the cook-along opens, steps, keeps its session across a reload;
     La lista checks persist per (item, trip); the kitchen settings render; the sibling gist is refused; the ring a
     finger would hit is the ring (elementFromPoint, never a dispatched click on a hidden node).
     CONTROLS: the log assertion is re-run with OLLA.logMeal stubbed out and must read FAIL (the instrument can see an
     absent write); gate.sh also requires the explicit CONTROL line to read FAIL. -->
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="out"></pre>
<iframe id="f" src="about:blank" style="width:400px;height:860px"></iframe>
<script>
'use strict';
const out = [];
function log(name, ok, extra) { out.push(`HARNESS: ${ok ? 'PASS' : 'FAIL'} >> ${name}${extra ? ' >> ' + extra : ''}`); render(); }
function render() { document.getElementById('out').textContent = out.join('\n'); }
const f = document.getElementById('f');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const W = () => f.contentWindow, D = () => f.contentDocument;
const q = s => D().querySelector(s), qa = s => Array.from(D().querySelectorAll(s));
const st = () => JSON.parse(W().localStorage.getItem('olla.v1'));
const E = name => W().eval(name);
async function loadApp() { f.src = 'index.html?h=' + Date.now(); await new Promise(r => f.onload = r); await sleep(800); }
function hit(el) { const r = el.getBoundingClientRect(); if (r.width < 8 || r.height < 8) return false; const x = D().elementFromPoint(r.left + r.width / 2, r.top + r.height / 2); return x === el || el.contains(x); }
function eff(entries) { if (!Array.isArray(entries) || !entries.length) return null; return entries.reduce((a, b) => ((b.at || 0) >= (a.at || 0) ? b : a)); }
(async () => {
  try {
    localStorage.clear();
    await loadApp();
    const today = E('OLLAUI').todayYmd();
    log('boots on Hoy', q('#bottom-tabs .tab.active') && q('#bottom-tabs .tab.active').dataset.view === 'hoy');
    log('state written on boot with a plan for today', !!(st() && st().plan && st().plan.days[today]));
    log('schema is 2', st() && st().schema === 2, st() && String(st().schema));
    const slots = E('OLLA').slotsFor(st(), today);
    log('Hoy renders one row per slot', qa('#app-root .row').length === slots.length, qa('#app-root .row').length + ' vs ' + slots.length);
    log('the pot panel is there', !!q('#app-root .pot-panel'));
    log('the week strip has seven bowls', qa('#app-root .bowl').length === 7, String(qa('#app-root .bowl').length));
    log('data-theme follows the clock (auto)', (() => { const h = new (W().Date)().getHours(); return D().documentElement.getAttribute('data-theme') === (h >= 7 && h < 19 ? 'tokyo' : 'macchiato'); })());
    // the ring a finger would hit is the ring
    const ring = q('#app-root .row:nth-child(1) .ring');
    ring.scrollIntoView({ block: 'center' }); await sleep(80);
    log('the first ring is what a finger hits (elementFromPoint)', hit(ring));
    // log «Sí, lo del plan» for the first slot via the sheet
    const sl0 = slots[0];
    ring.click(); await sleep(150);
    log('the ring opens the sheet', q('#olla-sheet').open);
    q('#olla-sheet [data-act="log-ate"]').click(); await sleep(200);
    const e0 = eff((st().log || {})[today + ':' + sl0]);
    log('«Sí, lo del plan» lands in the reality log', !!e0 && e0.s === 'ate', JSON.stringify(e0));
    log('the plan row was not written by the log', !st().plan.days[today][sl0].s);
    log('the ring turns «ate»', !!q('#app-root .row:nth-child(1) .ring.ate'));
    // RELOAD
    await loadApp();
    const e1 = eff((st().log || {})[today + ':' + sl0]);
    log('RELOAD keeps the log entry', !!e1 && e1.s === 'ate');
    log('…and the ring still reads «ate»', !!q('#app-root .row:nth-child(1) .ring.ate'));
    // CONTROL: the same assertion, with the write disabled, must see the absence
    {
      const s2 = slots[1];
      const O = E('OLLA'), real = O.logMeal; O.logMeal = () => ({ ok: true });
      q('#app-root .row:nth-child(2) .ring').click(); await sleep(150);
      q('#olla-sheet [data-act="log-ate"]').click(); await sleep(150);
      const ec = eff((st().log || {})[today + ':' + s2]);
      log('CONTROL (must read FAIL): a stubbed logMeal still lands in the log', !!ec && ec.s === 'ate');
      O.logMeal = real;
    }
    // La semana: cycle a FUTURE dinner, persist, reload
    q('#bottom-tabs .tab[data-view="semana"]').click(); await sleep(150);
    log('La semana renders seven day cards', qa('#app-root .day').length === 7, String(qa('#app-root .day').length));
    const tomorrow = E('OLLA').addDays(today, 1);
    const pill = q(`#app-root .kind[data-date="${tomorrow}"][data-slot="dinner"]`);
    const kBefore = st().plan.days[tomorrow].dinner.kind;
    pill.click(); await sleep(200);
    const kAfter = st().plan.days[tomorrow].dinner;
    log('a tap moves tomorrow\'s dinner to another kind, by hand', kAfter.kind !== kBefore && kAfter.hand === true, kBefore + ' → ' + kAfter.kind);
    await loadApp();
    log('RELOAD keeps the hand row', st().plan.days[tomorrow].dinner.kind === kAfter.kind && st().plan.days[tomorrow].dinner.hand === true);
    // El libro: recipe sheet scales
    q('#bottom-tabs .tab[data-view="libro"]').click(); await sleep(150);
    log('El libro lists recipes', qa('#app-root .rec').length >= 15, String(qa('#app-root .rec').length));
    q('#app-root .rec').click(); await sleep(150);
    log('a recipe opens with steps', q('#olla-sheet').open && qa('#olla-sheet .steps li').length >= 2);
    const q1 = (q('#olla-sheet .ings li .q') || {}).textContent;
    q('#olla-sheet [data-stepper="rx"] [data-d="1"]').click(); q('#olla-sheet [data-stepper="rx"] [data-d="1"]').click(); await sleep(80);
    const q2 = (q('#olla-sheet .ings li .q') || {}).textContent;
    log('the servings stepper rescales the quantities', !!q1 && q1 !== q2, q1 + ' → ' + q2);
    // the cook-along
    q('#olla-sheet [data-act="runner-start"]').click(); await sleep(200);
    log('the cook-along opens full-screen', !q('#runner').hidden && !!q('#runner .r-body'));
    q('#runner [data-act="r-next"]').click(); await sleep(120);
    log('«Empezar» moves to step 1', st().cookSession && st().cookSession.step === 0, JSON.stringify(st().cookSession && st().cookSession.step));
    await loadApp();
    log('RELOAD keeps the cook session; Hoy offers «Seguir»', !!st().cookSession && !!q('#app-root [data-act="runner-resume"]'));
    q('#app-root [data-act="runner-resume"]').click(); await sleep(150);
    q('#runner [data-act="runner-close"]').click(); await sleep(100);
    // La lista
    q('#bottom-tabs .tab[data-view="lista"]').click(); await sleep(150);
    const items = qa('#app-root .item');
    log('La lista derives items for the week\'s cooks', items.length >= 3, String(items.length));
    if (items.length) {
      const key = items[0].dataset.key; items[0].click(); await sleep(150);
      const c = (st().groceries.checked || {})[key];
      log('checking an item persists per item@trip', !!c && (c.v === true || c === true), key + ' ' + JSON.stringify(c));
      log('the key carries the trip date', /@\d{4}-\d{2}-\d{2}$/.test(key || ''), key);
    }
    // settings
    q('#settings-btn').click(); await sleep(200);
    log('the kitchen settings render inside the sheet', q('#settings-modal').open && qa('#kitchen-settings [data-kact="win"]').length === 7);
    q('#settings-modal [data-close="settings"]').click(); await sleep(80);
    // the sibling's gist is refused
    log('looksLikeMyState refuses cuaderno.json', E('looksLikeMyState')({ settings: {}, exercises: [], sessions: [] }) === false);
    log('looksLikeMyState accepts our state', E('looksLikeMyState')(st()) === true);
    log('the app reads the LOCAL day', E('OLLAUI').todayYmd() === E('OLLA').ymd(new (W().Date)()));
    log('CONTROL (must read FAIL): Hoy has zero rows', qa('#app-root .row').length === 0 && false);
  } catch (e) { log('harness crashed', false, String(e && e.stack || e).slice(0, 300)); }
  out.push('HARNESS: DONE'); render();
})();
</script>
</body>
</html>
